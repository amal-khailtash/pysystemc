[project]
name = "pysystemc"
version = "0.16.0"
description = "SystemC Python Binding using cppyy"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Amal Khailtash", email = "amal.khailtash@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cppyy>=3.5",
    "loguru>=0.7",
    "prompt-toolkit>=3.0.53",
    "pygments>=2.19",
    "rich>=14",
]

[project.urls]
Homepage = "https://github.com/amal-khailtash/pysystemc"
Documentation = "https://pysystemc.readthedocs.io/"
Issues = "https://github.com/amal-khailtash/pysystemc/issues"

[project.scripts]
pysystemc = "amal.eda.cli:main"
pysystemc-cpp = "amal.eda.systemc._runner:main"

[tool.uv.build-backend]
module-name = "amal"
namespace = true
source-include = ["build_backend/**"]
source-exclude = ["src/amal/eda/systemc/_native/**"]

[build-system]
requires = ["uv_build>=0.9,<0.14", "cmake>=3.20"]
build-backend = "backend"
backend-path = ["build_backend"]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=7.0",
    "pytest-xdist>=3.8",
    "ruff>=0.17.0",
    { include-group = "docs" },
]

docs = [
    "sphinx>=8",
    "myst-parser>=4",
    "sphinx-rtd-theme>=3",
]

# Simulation tests spawn fresh interpreters to isolate SystemC kernel state.
[tool.coverage.run]
source = ["amal.eda.systemc"]
patch = ["subprocess"]
# The pytest parent intentionally never imports the singleton native kernel;
# coverage data is collected by its simulation subprocesses instead.
disable_warnings = ["module-not-imported", "no-data-collected"]

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["submodules", "build", ".ai", ".codex", ".agents"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP"]

[tool.ruff.lint.per-file-ignores]
# Native setup must precede cppyy imports; namespace exports are dynamic.
"src/amal/eda/systemc/__init__.py" = ["E402", "F403", "F405"]
"src/amal/eda/systemc/sc_core/__init__.py" = ["E402"]
"src/amal/eda/systemc/_runtime.py" = ["E402"]
"examples/**/*.py" = ["E402"]
"tests/models/*.py" = ["E402"]
