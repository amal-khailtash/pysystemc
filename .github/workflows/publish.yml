name: 04. Publish
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      repository:
        description: Publication destination
        type: choice
        options: [pypi, testpypi]
        default: pypi
        required: true
      tag:
        description: Existing immutable release tag to publish
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  build:
    name: Build tagged distributions
    uses: ./.github/workflows/distributions.yml
    with:
      ref: ${{ inputs.tag }}
  verify:
    needs: build
    outputs:
      project: ${{ steps.metadata.outputs.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
      - name: Verify immutable tag and package version
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git -c safe.directory="$PWD" show-ref --verify "refs/tags/$RELEASE_TAG"
          git -c safe.directory="$PWD" merge-base --is-ancestor HEAD origin/main
          uv run --no-project python -c 'import os, tomllib; from pathlib import Path; version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]; assert os.environ["RELEASE_TAG"] == "v" + version, "Release tag must match pyproject.toml version"'
          uv run --no-project python -c 'import os, tomllib; from pathlib import Path; name = tomllib.loads(Path("pyproject.toml").read_text())["project"]["name"]; print("project=" + name, file=open(os.environ["GITHUB_OUTPUT"], "a"))'
      - uses: actions/download-artifact@v7
        with:
          name: ci-distributions
          path: dist/
      # Test as a wheel consumer, without the manylinux compiler toolset's
      # headers and runtime paths affecting Cling's runtime C++ compilation.
      - name: Install and test bundled wheel
        if: github.event.repository.name == 'pysystemc'
        run: |
          wheel=$(realpath dist/*.whl)
          check=$(realpath tools/check_wheel.py)
          examples_check=$(realpath tools/check_installed_examples.py)
          cd /tmp
          uv run --no-project --with "$wheel" python -c "import subprocess, sys; subprocess.run([sys.executable, sys.argv[1]], check=True, timeout=120)" "$check"
          uv run --no-project --with "$wheel" python "$examples_check"
  publish:
    name: Publish and verify package index
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ inputs.repository || 'pypi' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/download-artifact@v7
        with:
          name: ci-distributions
          path: dist/
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6
      - name: Publish with uv trusted publishing
        if: inputs.repository != 'testpypi'
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/
      - name: Publish to TestPyPI with uv trusted publishing
        if: inputs.repository == 'testpypi'
        run: uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/ --check-url https://test.pypi.org/simple/
      - name: Verify published versions and artifact hashes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ inputs.repository || 'pypi' }}
          PROJECT: ${{ needs.verify.outputs.project }}
        run: |
          uv run --no-project python tools/verify_publication.py --project "$PROJECT" --version "${RELEASE_TAG#v}" --repository "$REPOSITORY"
  announcement:
    name: Publish GitHub release after PyPI
    needs: publish
    if: inputs.repository != 'testpypi'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ci-distributions
          path: dist/
      - name: Attach verified distributions and publish draft
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" dist/* --clobber
          if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true ]; then
            gh release edit "$RELEASE_TAG" --draft=false
          fi
  documentation:
    name: Activate release documentation after PyPI
    timeout-minutes: 10
    needs: publish
    if: inputs.repository != 'testpypi'
    runs-on: ubuntu-latest
    steps:
      - name: Synchronize, activate, and build released documentation
        env:
          RTD_TOKEN: ${{ secrets.READTHEDOCS_TOKEN }}
          RTD_PROJECT: ${{ github.event.repository.name }}
          RTD_VERSION: ${{ inputs.tag }}
        run: |
          python - <<'PYTHON'
          import json
          import os
          import time
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          token = os.environ["RTD_TOKEN"]
          if not token:
              raise SystemExit("READTHEDOCS_TOKEN is required")
          base = "https://app.readthedocs.org/api/v3/projects/" + quote(os.environ["RTD_PROJECT"], safe="")
          version = base + "/versions/" + quote(os.environ["RTD_VERSION"], safe="") + "/"

          def request(url, method="GET", data=None):
              headers = {"Authorization": "Token " + token, "Content-Type": "application/json"}
              body = None if data is None else json.dumps(data).encode()
              with urlopen(Request(url, data=body, headers=headers, method=method), timeout=30) as response:
                  return response.read()

          request(base + "/sync-versions/", "POST")
          for attempt in range(30):
              try:
                  request(version)
                  break
              except HTTPError as error:
                  if error.code != 404:
                      raise SystemExit(f"Read the Docs version lookup failed: HTTP {error.code}") from None
                  if attempt == 29:
                      raise SystemExit("Read the Docs did not discover the release tag within five minutes") from None
                  time.sleep(10)
          request(version, "PATCH", {"active": True})
          result = request(version + "builds/", "POST", {})
          print("Read the Docs release build requested:", result.decode())
          PYTHON
