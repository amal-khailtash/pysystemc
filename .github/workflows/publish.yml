name: Publish Python distributions
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      repository:
        description: Publication destination
        type: choice
        options: [testpypi, pypi]
        default: testpypi
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
      - name: Check release tag matches package version
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --no-project python -c 'import os, tomllib; from pathlib import Path; version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]; assert os.environ["RELEASE_TAG"] == "v" + version, "Release tag must match pyproject.toml version"'
      - name: Build native dependencies and distributions
        run: |
          uv build
          uv tool run --from auditwheel auditwheel repair --plat manylinux_2_28_x86_64 --wheel-dir repaired dist/*.whl
          rm dist/*.whl
          mv repaired/*.whl dist/
      - name: Install and test bundled wheel
        run: |
          wheel=$(realpath dist/*.whl)
          check=$(realpath tools/check_wheel.py)
          cd /tmp
          uv run --no-project --with "$wheel" python -c "import subprocess, sys; subprocess.run([sys.executable, sys.argv[1]], check=True, timeout=120)" "$check"
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'pypi' || inputs.repository }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist/
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: github.event_name == 'push' || inputs.repository == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
