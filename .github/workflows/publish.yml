name: 04. Publish
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      repository:
        description: Publication destination
        type: choice
        options: [testpypi, pypi]
        default: pypi
        required: true
      tag:
        description: Existing release tag to publish (for example v0.12.0)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  tests:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag }}
    secrets: inherit
  verify:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
      - name: Check release tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git -c safe.directory="$PWD" show-ref --verify "refs/tags/$RELEASE_TAG"
          git -c safe.directory="$PWD" merge-base --is-ancestor HEAD origin/main
          uv run --no-project python -c 'import os, tomllib; from pathlib import Path; version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]; assert os.environ["RELEASE_TAG"] == "v" + version, "Release tag must match pyproject.toml version"'
      - uses: actions/download-artifact@v7
        with:
          name: ci-distributions
          path: dist/
      # Test as a wheel consumer, without the manylinux compiler toolset's
      # headers and runtime paths affecting Cling's runtime C++ compilation.
      - name: Install and test bundled wheel
        run: |
          wheel=$(realpath dist/*.whl)
          check=$(realpath tools/check_wheel.py)
          examples_check=$(realpath tools/check_installed_examples.py)
          cd /tmp
          uv run --no-project --with "$wheel" python -c "import subprocess, sys; subprocess.run([sys.executable, sys.argv[1]], check=True, timeout=120)" "$check"
          uv run --no-project --with "$wheel" python "$examples_check"
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ inputs.repository || 'pypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ci-distributions
          path: dist/
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: inputs.repository != 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
  documentation:
    needs: publish
    if: inputs.repository != 'testpypi'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger released documentation after PyPI publication
        env:
          RTD_TOKEN: ${{ secrets.READTHEDOCS_TOKEN }}
          RTD_PROJECT: pysystemc
          RTD_VERSION: ${{ inputs.tag }}
        run: |
          test -n "$RTD_TOKEN"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Token $RTD_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "https://readthedocs.org/api/v3/projects/$RTD_PROJECT/versions/$RTD_VERSION/builds/"
