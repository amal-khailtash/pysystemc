name: 02. CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
          enable-cache: true
      - name: Compute native cache identity
        id: native-key
        shell: bash
        run: |
          identity=$( { c++ --version; c++ -dumpmachine; cmake --version; git -C submodules/systemc rev-parse HEAD; sha256sum Makefile build_backend/backend.py; echo 'cxx17-pthreads-python3.14'; } | sha256sum | cut -d' ' -f1 )
          echo "key=$identity" >> "$GITHUB_OUTPUT"
      - name: Cache native dependencies
        uses: actions/cache@v4
        with:
          path: build/deps
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-key.outputs.key }}
      - name: Set up native and Python dependencies
        run: make setup
      - name: Check Python lint and formatting
        run: |
          make lint
          uv run ruff format --check .
      - name: Run semantic tests and coverage
        run: uv run pytest --cov=amal.eda.systemc --cov-report=term-missing --cov-report=xml:build/coverage/coverage.xml --cov-report=html:build/coverage/html
      - name: Save coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: build/coverage/
          if-no-files-found: warn
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && hashFiles('build/coverage/coverage.xml') != '' }}
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/coverage/coverage.xml
          disable_search: true
          fail_ci_if_error: false
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
          enable-cache: true
      - name: Build and repair native distributions
        run: |
          uv build
          uv tool run --from auditwheel auditwheel repair --plat manylinux_2_28_x86_64 --wheel-dir repaired dist/*.whl
          rm dist/*.whl
          mv repaired/*.whl dist/
      - uses: actions/upload-artifact@v7
        with:
          name: ci-distributions
          path: dist/*
  documentation:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
          enable-cache: true
      - name: Check documentation
        run: |
          uv sync --locked --only-group docs
          uv run --no-sync sphinx-build -W -b html docs build/docs
      - uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: build/docs/
