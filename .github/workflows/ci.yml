name: 02. CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    name: Select validation / release metadata
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
      - name: Select validation
        id: classify
        env:
          IS_RELEASE: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--') }}
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$IS_RELEASE" = true ]; then
            git show "$BASE_REF:tools/check_release_metadata.py" > "$RUNNER_TEMP/check_release_metadata.py"
            uv run --no-project python "$RUNNER_TEMP/check_release_metadata.py" --base "$BASE_REF" --head "$HEAD_REF"
            uv lock --check
            echo 'mode=release' >> "$GITHUB_OUTPUT"
            echo 'Release metadata validated; full source CI already runs on feature PRs.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'mode=full' >> "$GITHUB_OUTPUT"
            echo 'Running full feature validation.' >> "$GITHUB_STEP_SUMMARY"
          fi
  tests:
    name: Tests and coverage
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    uses: ./.github/workflows/coverage.yml
    with:
      ref: ${{ github.ref }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  build:
    name: Build distributions
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    uses: ./.github/workflows/distributions.yml
    with:
      ref: ${{ github.ref }}
  documentation:
    name: Build documentation
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
          enable-cache: true
      - name: Check documentation
        run: |
          if [ "${{ github.event.repository.name }}" = pysystemc ]; then
            uv sync --locked --only-group docs
            uv run --no-sync sphinx-build -E -W -b html docs build/docs
          else
            uv sync --locked --all-groups
            uv run --locked make -C docs api html
            mkdir -p build/docs
            cp -a docs/_build/html/. build/docs/
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: build/docs/
