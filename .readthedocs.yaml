version: 2
build:
  # Read the Docs OS identifiers differ from GitHub runner labels.
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    post_create_environment:
      - curl -LsSf https://astral.sh/uv/install.sh | sh
    post_install:
      # Selecting an interpreter alone creates a checkout .venv. Install into
      # the environment used by Read the Docs' subsequent Sphinx command.
      - UV_PROJECT_ENVIRONMENT="$READTHEDOCS_VIRTUALENV_PATH" $HOME/.local/bin/uv sync --locked --only-group docs --python "$READTHEDOCS_VIRTUALENV_PATH/bin/python"
sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
