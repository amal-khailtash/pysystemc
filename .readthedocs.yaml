version: 2
build:
  # Read the Docs OS identifiers differ from GitHub runner labels.
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    post_create_environment:
      - curl -LsSf https://astral.sh/uv/install.sh | sh
    post_install:
      - $HOME/.local/bin/uv sync --only-group docs --python "$READTHEDOCS_VIRTUALENV_PATH/bin/python"
sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
